services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    env_file:
      - packages/api/.env
    environment:
      - PORT=3001
      - DATABASE_URL=postgres://postgres:postgres@background-agent-railway-db-1:5432/railway_sessions
    ports:
      - "3001:3001"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railway_sessions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sandbox-a:
    build:
      context: packages/sandbox
      dockerfile: Dockerfile
    ports:
      - "9081:8080"

  sandbox-b:
    build:
      context: packages/sandbox
      dockerfile: Dockerfile
    ports:
      - "9082:8080"

volumes:
  postgres_data:
